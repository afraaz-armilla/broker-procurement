[project]
name = "bpb"
version = "0.1.0"
description = "Broker Prospecting Bot — signal + coverage discovery, gated outreach queue, Slack approval hand-off"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
    "lxml>=5.2",
    "typer>=0.12",
    "structlog>=24.1",
    "tenacity>=8.4",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "feedparser>=6.0",
    "trafilatura>=1.10",
    "jinja2>=3.1",
    "python-ulid>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
bpb = "bpb.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
